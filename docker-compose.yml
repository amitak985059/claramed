services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claramed-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - claramed-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claramed-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - claramed-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: claramed-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - claramed-network

networks:
  claramed-network:
    driver: bridge
